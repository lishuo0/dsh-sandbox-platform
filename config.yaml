# 平台唯一配置。数据库、阿里云沙箱、OSS 都写在这里。
# 沙箱密钥和 OSS 留空时，文件写到本项目 var/objects，脑的本地沙箱读同一份。
# 数据库由本项目 docker compose 启动，账号见下方 url。

database:
  url: postgres://dsh:dsh@localhost:5432/dsh

aliyun:
  sandbox:
    apiKey: ""
    apiUrl: https://api.cn-beijing.sandbox.aliyuncs.com
    domain: cn-beijing.sandbox.aliyuncs.com
    template: ""
    roleArn: ""
  oss:
    region: cn-beijing
    endpoint: ""
    bucket: ""
    accessKeyId: ""
    accessKeySecret: ""

http:
  host: 0.0.0.0
  port: 3000

auth:
  tokenSecret: ""
  tokenTtlHours: 168
  adminUsername: admin
  adminPassword: ""

# 32 字节密钥的 base64。模型 Key 和 MCP 请求头用它加密。脑的配置里必须是同一把。
credentialsKey: ""

brain:
  baseUrl: http://127.0.0.1:8080
  appId: platform
  appKey: ""

storage:
  dir: var/objects
